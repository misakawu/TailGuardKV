model:
  pilot_model: /DATACENTER3/zhenxiang.wang/resource/Qwen2.5-7B-Instruct
  cache_dir: /DATACENTER3/zhenxiang.wang/resource/huggingface
profiles:
  adapters:
  - full
  - kivi
  - h2o
  names:
  - full_gpu
  - kivi_4bit_residual32
  - kivi_4bit_residual64
  - kivi_2bit_residual32
  - kivi_2bit_residual64
  - h2o_heavy10_recent10
  - h2o_heavy15_recent15
  - h2o_heavy20_recent20
  specs:
    full_gpu:
      exact: true
    kivi_4bit_residual32:
      exact: false
    kivi_4bit_residual64:
      exact: false
    kivi_2bit_residual32:
      exact: false
    kivi_2bit_residual64:
      exact: false
    h2o_heavy10_recent10:
      exact: false
    h2o_heavy15_recent15:
      exact: false
    h2o_heavy20_recent20:
      exact: false
policies:
  record_rejected_unsafe: true
  names:
  - full_lru
  - static_best
  - static_safe
  - quality_oracle
  - utility_dynamic
  - uncalibrated_dynamic
pilot:
  epsilons:
  - 0.05
  - 0.1
  deltas:
  - 0.05
  - 0.1
  memory_budgets_mib:
  - 10.0
  - 20.0
  - 30.0
  - 40.0
  - 50.0
  - 60.0
  - 70.0
  - 80.0
  - 90.0
  - 100.0
data:
  requests: /DATACENTER3/zhenxiang.wang/resource/tailguardkv_pilot/requests/longbench_xsum_pilot.jsonl
  calibration_fraction: 0.5
  max_requests: 80
profile_smoke:
  max_new_tokens: 16
  timeout_s: 180
  repeat: 1
  local_files_only: true
  vllm_enforce_eager: true
  vllm_gpu_memory_utilization: 0.75
  vllm_max_model_len: 1024
outputs:
  smoke_profiles: out/profile_tables/run_mem_test_profiles.csv
  smoke_profile_checks: out/profile_tables/run_mem_test_profile_checks.csv
  smoke_policy: out/policy_tables/run_mem_test_policy.csv
  smoke_summary: out/policy_tables/run_mem_test_summary.csv
