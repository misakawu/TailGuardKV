model:
  pilot_model: /DATACENTER3/zhenxiang.wang/resource/Qwen2.5-7B-Instruct
  cache_dir: /DATACENTER3/zhenxiang.wang/resource/huggingface

profiles:
  adapters:
    - full
    - kivi
    - h2o
  names:
    - full_gpu
    - kivi_4bit_residual32
    - kivi_4bit_residual64
    - kivi_2bit_residual32
    - kivi_2bit_residual64
    - h2o_heavy10_recent10
    - h2o_heavy15_recent15
    - h2o_heavy20_recent20
  specs:
    full_gpu: {exact: true}
    kivi_4bit_residual32: {exact: false}
    kivi_4bit_residual64: {exact: false}
    kivi_2bit_residual32: {exact: false}
    kivi_2bit_residual64: {exact: false}
    h2o_heavy10_recent10: {exact: false}
    h2o_heavy15_recent15: {exact: false}
    h2o_heavy20_recent20: {exact: false}

policies:
  record_rejected_unsafe: true
  names:
    - full_lru
    - static_best
    - static_safe
    - utility_dynamic
    - uncalibrated_dynamic

pilot:
  epsilons: [0.02, 0.05, 0.10]
  deltas: [0.01, 0.05, 0.10]
  memory_budgets_mib: [1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000]

data:
  requests: data/fixtures/pilot_qa_summary_requests.jsonl
  calibration_fraction: 0.5
  max_requests: 200

profile_smoke:
  max_new_tokens: 16
  timeout_s: 180
  repeat: 1
  local_files_only: true
  vllm_enforce_eager: true
  vllm_gpu_memory_utilization: 0.75
  vllm_max_model_len: 1024

outputs:
  smoke_profiles: out/baseline_wide_sweep/profile_tables/pilot_smoke_measured_profiles.csv
  smoke_policy: out/baseline_wide_sweep/policy_tables/pilot_smoke_measured_policy.csv
  smoke_summary: out/baseline_wide_sweep/policy_tables/pilot_smoke_measured_summary.csv
  smoke_total_summary: out/baseline_wide_sweep/policy_tables/baseline_wide_sweep_total_summary.csv
