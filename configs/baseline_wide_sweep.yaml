experiment:
  type: baseline_session

backend:
  name: measured_replay

model:
  pilot_model: /DATACENTER3/zhenxiang.wang/resource/Qwen2.5-7B-Instruct
  cache_dir: /DATACENTER3/zhenxiang.wang/resource/huggingface

profiles:
  adapters:
    - full
    - kivi
    - h2o
  names:
    - full_gpu
    - kivi_4bit_residual32
    - kivi_4bit_residual64
    - kivi_2bit_residual32
    - kivi_2bit_residual64
    - h2o_heavy10_recent10
    - h2o_heavy15_recent15
    - h2o_heavy20_recent20
  specs:
    full_gpu: {exact: true}
    kivi_4bit_residual32: {exact: false}
    kivi_4bit_residual64: {exact: false}
    kivi_2bit_residual32: {exact: false}
    kivi_2bit_residual64: {exact: false}
    h2o_heavy10_recent10: {exact: false}
    h2o_heavy15_recent15: {exact: false}
    h2o_heavy20_recent20: {exact: false}

policies:
  record_rejected_unsafe: true
  names:
    - full_lru
    - static_best
    - static_safe
    - utility_dynamic
    - uncalibrated_dynamic

pilot:
  epsilons: [0.10]
  deltas: [0.10]
  memory_budgets_mib: [15, 20, 25, 30, 35, 50, 64, 80, 96, 112, 128, 160, 192, 256]

data:
  requests: data/fixtures/baseline_wide_sweep_session10.jsonl
  calibration_fraction: 0.5
  max_requests: 10

profile_smoke:
  max_new_tokens: 16
  timeout_s: 180
  repeat: 1
  local_files_only: true
  vllm_enforce_eager: true
  vllm_gpu_memory_utilization: 0.75
  vllm_max_model_len: 1024

outputs:
  smoke_profiles: out/baseline_smoke_final_rerun_20260913/profile_tables/baseline_smoke_final_rerun_20260913_profiles.csv
  smoke_policy: out/baseline_smoke_final_rerun_20260913/policy_tables/baseline_smoke_final_rerun_20260913_policy.csv
  smoke_summary: out/baseline_smoke_final_rerun_20260913/policy_tables/baseline_smoke_final_rerun_20260913_summary.csv
  smoke_total_summary: out/baseline_smoke_final_rerun_20260913/policy_tables/baseline_smoke_final_rerun_20260913_total_summary.csv
